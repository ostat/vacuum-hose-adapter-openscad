name: Release Combined OpenSCAD Files

# Builds the single-file (combined) versions of each top-level .scad and publishes
# them as a numbered GitHub release. Nothing is committed back to the repository.
#
# Version format: vYYYY.MM.DD.<run number>, e.g. v2026.11.13.42
# Newest release (stable link, always the latest build):
#   https://github.com/ostat/vacuum-hose-adapter-openscad/releases/latest/download/vacuum-hose-adapter.scad

on:
  push:
    branches:
      - main
    paths:
      - "**/*.scad"
      - "scripts/combined-openscad_script.ps1"
      - ".github/workflows/generate-combined.yaml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-combined
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $version = "v$((Get-Date).ToUniversalTime().ToString('yyyy.MM.dd')).$env:GITHUB_RUN_NUMBER"
          Write-Host "Release version: $version"
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Run OpenSCAD combine script
        shell: pwsh
        run: |
          pwsh ./scripts/combined-openscad_script.ps1 -OutputFolder "$env:RUNNER_TEMP/combined" -Version "${{ steps.version.outputs.VERSION }}"
          Get-ChildItem "$env:RUNNER_TEMP/combined"

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $files = (Get-ChildItem "$env:RUNNER_TEMP/combined" -Filter *.scad).FullName
          gh release create $version $files `
            --target $env:GITHUB_SHA `
            --title $version `
            --generate-notes `
            --latest
